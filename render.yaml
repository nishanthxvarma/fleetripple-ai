services:
  - type: web
    name: fleetripple-ai-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./fleetripple.db
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: API_PREFIX
        value: /api
